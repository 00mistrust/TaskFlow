<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Historique des activités</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }
    .project-pack-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .project-pack-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(60, 52, 137, 0.15);
      border-color: #3c3489;
    }
    .folder-icon {
      font-size: 3.5rem;
      color: #ffca28;
      margin-bottom: 15px;
    }
    .timeline-container {
      position: relative;
      margin-top: 30px;
      padding-left: 24px;
    }
    .timeline-container::before {
      content: '';
      position: absolute;
      left: 0;
      top: 5px;
      bottom: 5px;
      width: 3px;
      background: #3c3489;
      border-radius: 2px;
    }
    .activity-item {
      position: relative;
      background: white;
      padding: 16px 20px;
      margin-bottom: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .activity-item::before {
      content: '';
      position: absolute;
      left: -29px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      background: #3c3489;
      border: 3px solid #f8f9fa;
      border-radius: 50%;
    }
    .activity-text strong { color: #1a1a1a; }
    .activity-time {
      font-size: 0.85rem;
      color: #6b7280;
      font-weight: 500;
      white-space: nowrap;
      margin-left: 15px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
    }
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color: #3c3489;">
    <a class="navbar-brand fw-bold fs-4" href="dashboard.html">
      <i class="bi bi-kanban-fill me-2"></i>TaskFlow
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Tableau de bord</a></li>
        <li class="nav-item"><a class="nav-link" href="projects.html"><i class="bi bi-folder me-1"></i>Projets</a></li>
        <li class="nav-item"><a class="nav-link" href="members.html"><i class="bi bi-people me-1"></i>Membres</a></li>
        <li class="nav-item"><a class="nav-link" href="tasks.html"><i class="bi bi-check2-square me-1"></i>Tâches</a></li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item me-3">
          <a class="nav-link active" href="activities.html" title="Historique des activités">
            <i class="bi bi-clock-history fs-5"></i>
          </a>
        </li>
        <li class="nav-item me-3">
          <a class="nav-link position-relative" href="notifications.html">
            <i class="bi bi-bell-fill fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notifBadge">0</span>
          </a>
        </li>
        <li class="nav-item me-3">
          <span class="navbar-text text-white">
            <i class="bi bi-person-circle me-1"></i>
            <span id="userName">Utilisateur</span>
          </span>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-light btn-sm" id="logoutBtn">
            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 style="color: #3c3489;" id="pageTitle"><strong>Historique des activités</strong></h2>
      <button class="btn btn-outline-secondary btn-sm" id="btnBack" style="display: none;" onclick="showPacksView()">
        <i class="bi bi-arrow-left me-1"></i>Retour aux packs projets
      </button>
    </div>

    <div id="packsSection">
      <p class="text-muted">Sélectionnez un pack projet ci-dessous pour consulter son fil chronologique complet.</p>
      <div class="projects-grid" id="projectsGrid"></div>
    </div>

    <div id="feedSection" style="display: none;">
      <div class="timeline-container" id="timelineContainer"></div>
    </div>

    <div id="statusMessage" class="empty-state" style="display: none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script src="js/activities.js"></script>
</body>
</html>
