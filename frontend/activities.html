<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Historique des activités</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .projects-grid {
      display: grid;
      /* Wider base width and larger gap to make it look less cramped (moyen/grand) */
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px; 
      margin-top: 24px;
    }
    
    .project-pack-card {
      background: #ffffff;
      /* Removed all borders as requested */
      border: none;
      border-radius: 16px;
      /* Balanced medium footprint with good internal spacing */
      padding: 24px;
      text-align: left;
      /* Rich, deep multi-layered modern shadow instead of borders */
      box-shadow: 0 12px 30px -5px rgba(15, 23, 42, 0.1), 
                  0 6px 16px -2px rgba(15, 23, 42, 0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .project-pack-card:hover {
      transform: translateY(-4px);
      /* Deeper shadow elevation on hover */
      box-shadow: 0 24px 45px -10px rgba(15, 23, 42, 0.15), 
                  0 10px 24px -4px rgba(15, 23, 42, 0.08);
    }

    /* Target the button from your image/JS output based on the original class structure */
    .btn-outline-secondary {
      /* Removed borders entirely */
      border: none !important;
      /* Perfect pill shape */
      border-radius: 100px !important;
      /* Generous full-color background */
      background: #3c3489 !important;
      /* White text with better organization/padding */
      color: #ffffff !important;
      font-size: 0.8rem !important;
      font-weight: 600 !important;
      padding: 8px 18px !important;
      transition: background-color 0.2s ease;
    }

    .btn-outline-secondary:hover {
      background: #1a1a1a !important; /* Neutral highlight */
      color: #ffffff !important;
    }

    /* Left panel elements alignment within the card */
    .project-meta-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .folder-icon {
      font-size: 1.1rem;
      color: #ffca28;
      margin-bottom: 0 !important;
      background: rgba(255, 202, 40, 0.12);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .project-name-title {
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Rich Timeline Spacing (What happens inside after click) */
    .timeline-container {
      position: relative;
      margin-top: 40px;
      padding-left: 35px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .timeline-container::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 10px;
      bottom: 10px;
      width: 2px;
      background: linear-gradient(to bottom, #3c3489, #e2e8f0 90%);
    }
    
    /* Borderless, Shadow-Based Activity Cards */
    .activity-item {
      position: relative;
      background: #ffffff;
      border: none;
      padding: 18px 24px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 20px -6px rgba(15, 23, 42, 0.04),
                  0 4px 8px -2px rgba(15, 23, 42, 0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .activity-item:hover {
      box-shadow: 0 12px 24px -5px rgba(15, 23, 42, 0.06),
                  0 6px 12px -2px rgba(15, 23, 42, 0.03);
    }
    
    /* Dynamic floating outer ring nodes */
    .activity-item::before {
      content: '';
      position: absolute;
      left: -33px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      background: #ffffff;
      border: 3px solid #3c3489;
      box-shadow: 0 0 0 4px rgba(60, 52, 137, 0.08);
      border-radius: 50%;
      z-index: 2;
    }
    
    /* Typography Organization */
    .activity-text {
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .activity-text strong { 
      color: #3c3489; /* brand color accent */
      font-weight: 600;
    }
    
    .activity-time {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 500;
      white-space: nowrap;
      margin-left: 24px;
      background: #f1f5f9;
      padding: 5px 12px;
      border-radius: 100px;
    }
    
    .empty-state {
      text-align: center;
      padding: 100px 20px;
      color: #94a3b8;
    }
    /* Custom styling for your specific span-based button */
span.btn.btn-sm.btn-outline-primary {
  background-color: #7d7bff !important; /* Full solid purple color */
  color: #ffffff !important;            /* Pure white text */
  border: none !important;             /* Completely removes the ugly borders */
  border-radius: 100px !important;     /* Makes it a beautiful rounded pill shape */
  padding: 8px 20px !important;        /* Generous spacing inside the button */
  font-weight: 600 !important;
  font-size: 0.85rem !important;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease-in-out;
}

/* Subtle neutral dark shade on hover */
span.btn.btn-sm.btn-outline-primary:hover {
  background-color: #ab75b9 !important; /* Elegant deeper purple shade */
  color: #ffffff !important;
}
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color: #3c3489;">
    <a class="navbar-brand fw-bold fs-4" href="dashboard.html">
      <i class="bi bi-kanban-fill me-2"></i>TaskFlow
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Tableau de bord</a></li>
        <li class="nav-item"><a class="nav-link" href="projects.html"><i class="bi bi-folder me-1"></i>Projets</a></li>
        <li class="nav-item"><a class="nav-link" href="members.html"><i class="bi bi-people me-1"></i>Membres</a></li>
        <li class="nav-item"><a class="nav-link" href="tasks.html"><i class="bi bi-check2-square me-1"></i>Tâches</a></li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item me-3">
          <a class="nav-link active" href="activities.html" title="Historique des activités">
            <i class="bi bi-clock-history fs-5"></i>
          </a>
        </li>
        <li class="nav-item me-3">
          <a class="nav-link position-relative" href="notifications.html">
            <i class="bi bi-bell-fill fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notifBadge">0</span>
          </a>
        </li>
        <li class="nav-item me-3">
          <span class="navbar-text text-white">
            <i class="bi bi-person-circle me-1"></i>
            <span id="userName">Utilisateur</span>
          </span>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-light btn-sm" id="logoutBtn">
            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 style="color: #3c3489;" id="pageTitle" class="fs-4 mb-1"><strong>Historique des activités</strong></h2>
        <p class="text-muted small mb-0" id="pageSubtitle">Sélectionnez un pack projet pour explorer les actions récentes de votre équipe.</p>
      </div>
      <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" id="btnBack" style="display: none;" onclick="showPacksView()">
        <i class="bi bi-arrow-left me-1"></i>Retour aux packs projets
      </button>
    </div>

    <div id="packsSection">
      <div class="projects-grid" id="projectsGrid">
        </div>
    </div>

    <div id="feedSection" style="display: none;">
      <div class="timeline-container" id="timelineContainer"></div>
    </div>

    <div id="statusMessage" class="empty-state" style="display: none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script src="js/activities.js"></script>
</body>
</html>
