<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Mes Projets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; }
        .navbar { background-color: #4b3f72; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark px-3">
        <a class="navbar-brand" href="#">TaskFlow</a>
        <div class="d-flex gap-3">
            <a href="dashboard.html" class="text-white text-decoration-none">Tableau de bord</a>
            <a href="projects.html" class="text-white text-decoration-none">Projets</a>
            <a href="#" class="text-white text-decoration-none">Déconnexion</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">Gestion des Projets</h1>

        <div class="card shadow-sm p-4 mb-4">
            <h2 class="h5">Ajouter un nouveau projet</h2>
            <form id="projectForm">
                <div class="mb-3">
                    <input type="text" id="title" class="form-control" placeholder="Titre du projet" required>
                </div>
                <div class="mb-3">
                    <textarea id="description" class="form-control" rows="3" placeholder="Description du projet"></textarea>
                </div>
                <div class="mb-3">
                    <input type="date" id="deadline" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary">Créer le projet</button>
            </form>
        </div>

        <div id="projectsList">
            <h2>Mes Projets</h2>
            <div id="container"></div>
        </div>
    </div>

    <script src="js/projects.js"></script>
</body>
</html>
