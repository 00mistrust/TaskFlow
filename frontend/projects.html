<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>TaskFlow - Mes Projets</title>

    
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color: #3c3489;">
  <a class="navbar-brand fw-bold fs-4" href="dashboard.html">
    <i class="bi bi-kanban-fill me-2"></i>TaskFlow
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link" href="dashboard.html">
          <i class="bi bi-speedometer2 me-1"></i>Tableau de bord
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="projects.html">
          <i class="bi bi-folder me-1"></i>Projets
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="members.html">
          <i class="bi bi-people me-1"></i>Membres
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="tasks.html">
          <i class="bi bi-check2-square me-1"></i>Tâches
        </a>
      </li>
    </ul>
    <ul class="navbar-nav ms-auto align-items-center">
      <li class="nav-item me-3">
        <a class="nav-link active" href="activities.html" title="Historique des activités">
          <i class="bi bi-clock-history fs-5"></i>
        </a>
      </li>
      <li class="nav-item me-3">
        <a class="nav-link position-relative" href="#">
          <i class="bi bi-bell-fill fs-5"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notifBadge">0</span>
        </a>
      </li>
      <li class="nav-item me-3">
        <span class="navbar-text text-white">
          <i class="bi bi-person-circle me-1"></i>
          <span id="userName">Utilisateur</span>
        </span>
      </li>
      <li class="nav-item">
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">
          <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
        </button>
      </li>
    </ul>
  </div>
</nav>

<<div class="container-fluid px-md-5 mt-5 mb-5">
    <div class="row mb-4 px-md-2">
        <div class="col-12">
            <div class="d-flex align-items-center">
                <div class="p-3 bg-white rounded-3 shadow-sm d-inline-block me-3">
                    <i class="bi bi-kanban fs-3 text-primary" style="color: #3c3489 !important;"></i>
                </div>
                <div>
                    <h1 class="mb-0 fw-bold h3" style="color: #1f2937;">Gestion des Projets</h1>
                    <p class="text-muted mb-0 small">Créez des espaces de travail et suivez vos collaborations.</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row mb-5 px-md-2">
        <div class="col-12">
            <div class="card shadow-sm p-4 border-0" style="border-radius: 16px; background-color: #ffffff;">
                <h2 class="h6 text-muted fw-bold mb-3"><i class="bi bi-plus-square-dotted me-2"></i>Nouveau projet</h2>
                <form id="projectForm">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label text-muted small fw-semibold mb-1">NOM DU PROJET</label>
                            <input type="text" id="title" class="form-control bg-light border-0 py-2 small" style="border-radius: 8px;" placeholder="Ex: Refonte Site Web" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-muted small fw-semibold mb-1">DATE LIMITE</label>
                            <input type="date" id="deadline" class="form-control bg-light border-0 py-2 small" style="border-radius: 8px;" title="Date limite">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label text-muted small fw-semibold mb-1">DESCRIPTION</label>
                            <textarea id="description" class="form-control bg-light border-0 py-2 small" rows="1" style="border-radius: 8px; resize: none;" placeholder="Courte description..."></textarea>
                        </div>
                        <div class="col-md-2 d-grid">
                            <button type="submit" class="btn text-white py-2 shadow-sm fw-semibold" style="background-color: #3c3489; border-radius: 8px; font-size: 0.9rem;">
                                <i class="bi bi-plus-circle me-1"></i>Créer
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="row g-5">
        <div class="col-md-6">
            <div class="p-4 bg-white shadow-sm" style="border-radius: 16px; border: 1px solid #e5e7eb; min-height: 400px;">
                <h3 class="text-primary pb-3 mb-4 h6 fw-bold border-bottom d-flex align-items-center" style="letter-spacing: 0.5px;">
                    <i class="bi bi-folder-check me-2 fs-5"></i>MES PROJETS 
                </h3>
                <div id="mesProjetsList" class="d-flex flex-column gap-3"></div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="p-4 bg-white shadow-sm" style="border-radius: 16px; border: 1px solid #e5e7eb; min-height: 400px;">
                <h3 class="text-info pb-3 mb-4 h6 fw-bold border-bottom d-flex align-items-center" style="color: #0ea5e9 !important; letter-spacing: 0.5px;">
                    <i class="bi bi-folder-symlink me-2 fs-5"></i>PROJETS PARTAGÉS AVEC MOI
                </h3>
                <div id="projetsPartagesList" class="d-flex flex-column gap-3"></div>
            </div>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
