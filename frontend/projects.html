<div class="container mt-4">
        <h1 class="mb-4"><strong>Gestion des Projets</strong></h1>
    <div class="card shadow-sm p-3 mb-4">
    <h2 class="h6 text-secondary mb-3"><i class="bi bi-plus-square-dotted me-2"></i>Nouveau projet</h2>
    <form id="projectForm">
        <div class="row g-2 align-items-center">
            <div class="col-md-3">
                <input type="text" id="title" class="form-control form-control-sm" placeholder="Titre du projet" required>
            </div>
            
            <div class="col-md-2">
                <input type="date" id="deadline" class="form-control form-control-sm" title="Date limite">
            </div>
            
            <div class="col-md-5">
                <textarea id="description" class="form-control form-control-sm" rows="1" placeholder="Courte description"></textarea>
            </div>
            
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle"></i> Créer
                </button>
            </div>
        </div>
    </form>
</div>
        <div class="row g-4 mt-2">
            <div class="col-md-6 border-end pe-md-4">
                <h3 class="text-primary border-bottom pb-2 mb-3 h5 fw-bold">
                    <i class="bi bi-folder-check me-2"></i>Mes Projets
                </h3>
                <div id="mesProjetsList" class="d-flex flex-column gap-3"></div>
            </div>

            <div class="col-md-6 ps-md-4">
                <h3 class="text-info border-bottom pb-2 mb-3 h5 fw-bold">
                    <i class="bi bi-folder-symlink me-2"></i>Projets Assignés
                </h3>
                <div id="projetsPartagesList" class="d-flex flex-column gap-3"></div>
            </div>
        </div>
    <div class="modal fade" id="editProjectModal" tabindex="-1" aria-labelledby="editProjectModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow" style="border-radius: 16px; border: none;">
      <div class="modal-header text-white" style="background-color: #3c3489; border-radius: 16px 16px 0 0;">
        <h5 class="modal-title fw-bold" id="editProjectModalLabel"><i class="bi bi-pencil-square me-2"></i>Modifier le projet</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="editProjectForm">
          <input type="hidden" id="editProjectId">
          <div class="mb-3">
            <label for="editTitle" class="form-label fw-semibold">Titre du projet <span class="text-danger">*</span></label>
            <input type="text" class="form-control bg-light" id="editTitle" required>
          </div>
          <div class="mb-3">
            <label for="editDeadline" class="form-label fw-semibold">Date limite</label>
            <input type="date" class="form-control bg-light" id="editDeadline">
          </div>
          <div class="mb-3">
            <label for="editDescription" class="form-label fw-semibold">Description</label>
            <textarea class="form-control bg-light" id="editDescription" rows="3"></textarea>
          </div>
          <div class="text-end mt-4">
            <button type="button" class="btn btn-light me-2" data-bs-dismiss="modal">Annuler</button>
            <button type="submit" class="btn text-white px-4" style="background-color: #3c3489; border: none;">
              <i class="bi bi-check2 me-1"></i>Sauvegarder
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/navbar.js"></script>
</body>
