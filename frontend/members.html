<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Membres</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --nav-bg: #3c3489; /* اللون البنفسجي المعتمد في الصورة */
            --text-light: rgba(255, 255, 255, 0.9);
        }

        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }

        /* Navbar الموحد تماماً كما في الصورة */
        .navbar {
            background-color: var(--nav-bg) !important;
            padding: 0.6rem 1.5rem;
        }

        .navbar-brand {
            color:#4f46e5 !important; /* لون لوغو TaskFlow */
            font-weight: bold;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-links-container {
            display: flex;
            gap: 20px;
            margin-left: 30px;
        }

        .nav-link-custom {
            color: white !important;
            text-decoration: none;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link-custom i {
            font-size: 1.1rem;
        }

        /* User Info & Icons (الجهة اليمنى) */
        .right-nav {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
        }

        .notification-icon {
            position: relative;
            color: white;
            font-size: 1.2rem;
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #f44336;
            color: white;
            font-size: 0.65rem;
            border-radius: 50%;
            padding: 2px 5px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 0.95rem;
        }

        .btn-logout {
            border: 1px solid white;
            color: white;
            background: transparent;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Body Content */
        .container-content {
            padding: 40px 10%;
        }

        .card-custom {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color: #3c3489;">
  <a class="navbar-brand fw-bold fs-4" href="dashboard.html">
    <i class="bi bi-kanban-fill me-2"></i>TaskFlow
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link" href="dashboard.html">
          <i class="bi bi-speedometer2 me-1"></i>Tableau de bord
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="projects.html">
          <i class="bi bi-folder me-1"></i>Projets
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="members.html">
          <i class="bi bi-people me-1"></i>Membres
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="tasks.html">
          <i class="bi bi-check2-square me-1"></i>Tâches
        </a>
      </li>
    </ul>
    <ul class="navbar-nav ms-auto align-items-center">
      <li class="nav-item me-3">
        <a class="nav-link active" href="activities.html" title="Historique des activités">
          <i class="bi bi-clock-history fs-5"></i>
        </a>
      </li>
      <li class="nav-item me-3">
        <a class="nav-link position-relative" href="#">
          <i class="bi bi-bell-fill fs-5"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notifBadge">0</span>
        </a>
      </li>
      <li class="nav-item me-3">
        <span class="navbar-text text-white">
          <i class="bi bi-person-circle me-1"></i>
          <span id="userName">Utilisateur</span>
        </span>
      </li>
      <li class="nav-item">
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">
          <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
        </button>
      </li>
    </ul>
  </div>
</nav>

    <div class="container-content">
        <h2 class="section-title"><i class="bi bi-people-fill"></i> Gestion des Membres</h2>

        <div class="card-custom">
            <h5 class="fw-bold mb-3">Inviter un nouveau membre</h5>
            <p class="text-muted small">Entrez l'adresse email pour ajouter un collaborateur au projet.</p>
            <form id="addMemberForm" class="row g-2 align-items-center">
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control border-start-0" placeholder="exemple@email.com" required>
                    </div>
                </div>
                <div class="col-md-3 text-end">
                    <button type="submit" class="btn btn-primary px-4" style="background-color: var(--nav-bg); border: none;">Inviter</button>
                </div>
            </form>
        </div>

        <div class="card-custom">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-bold mb-0">Membres actuels</h5>
                <span class="badge bg-secondary rounded-pill p-2">0 membres</span>
            </div>
            <div id="membersList" class="text-center py-4 text-muted">
                <i class="bi bi-arrow-repeat spin me-2"></i> Chargement des membres...
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
