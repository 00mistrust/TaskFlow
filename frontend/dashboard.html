<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow — Tableau de bord</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <style>
    .dashboard-card {
      transition: all 0.3s ease;
      border-radius: 12px;
      border: none;
      border-bottom: 4px solid transparent;
      text-decoration: none; /* Enlève le soulignement des liens */
      display: block; /* Pour que le lien prenne toute la carte */
    }
    
    .dashboard-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important;
    }

    /* Couleurs spécifiques au survol pour chaque carte */
    .card-projects:hover { border-bottom-color: #838297; }
    .card-assigned:hover { border-bottom-color: #b3c4c7; }
    .card-completed:hover { border-bottom-color: #198754; }
    .card-late:hover { border-bottom-color: #dc3545; }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px auto;
      font-size: 1.5rem;
    }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color: #3c3489;">
    <a class="navbar-brand fw-bold fs-4" href="dashboard.html">
      <i class="bi bi-kanban-fill me-2"></i>TaskFlow
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link active" href="dashboard.html">
            <i class="bi bi-speedometer2 me-1"></i>Tableau de bord
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="projects.html">
            <i class="bi bi-folder me-1"></i>Projets
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="members.html">
            <i class="bi bi-people me-1"></i>Membres
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="tasks.html">
            <i class="bi bi-check2-square me-1"></i>Tâches
          </a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item me-3">
          <a class="nav-link active" href="activities.html" title="Historique des activités">
            <i class="bi bi-clock-history fs-5"></i>
          </a>
        </li>
        <li class="nav-item me-3">
          <a class="nav-link position-relative" href="#" data-bs-toggle="modal" data-bs-target="#notifModal">
            <i class="bi bi-bell-fill fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notifBadge">0</span>
          </a>
        </li>
        <li class="nav-item me-3">
          <span class="navbar-text text-white">
            <i class="bi bi-person-circle me-1"></i>
            <span id="userName">Utilisateur</span>
          </span>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-light btn-sm" id="logoutBtn">
            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5 mb-5">
    <div class="d-flex justify-content-between align-items-end mb-4">
      <div>
        <h4 style="color: #3c3489; margin-bottom: 2px;"><strong>Bonjour <span id="dashboardWelcomeName" style="color: #4f46e5;"></span></strong></h4>
        <small class="text-muted" style="font-size: 0.9rem;">Voici ton résumé</small>
      </div>
      <p class="text-muted mb-0"><i class="bi bi-calendar3 me-1"></i> <span id="currentDate">Aujourd'hui</span></p>
    </div>
    
    <div class="row g-4">
      <div class="col-md-3">
        <a href="projects.html" class="card dashboard-card card-projects text-center shadow-sm p-4 text-decoration-none">
          <div class="icon-box bg-primary bg-opacity-10 text-primary">
            <i class="bi bi-folder2-open"></i>
          </div>
          <h6 class="text-muted fw-semibold">Projets actifs</h6>
          <h2 id="projetsActifs" class="fw-bold mb-0" style="color: #4f46e5;">0</h2>
        </a>
      </div>
      
      <div class="col-md-3">
        <a href="tasks.html" class="card dashboard-card card-assigned text-center shadow-sm p-4 text-decoration-none">
          <div class="icon-box bg-info bg-opacity-10 text-info">
            <i class="bi bi-list-task"></i>
          </div>
          <h6 class="text-muted fw-semibold">Tâches actives</h6>
          <h2 id="tachesAssignees" class="fw-bold mb-0 text-dark">0</h2>
        </a>
      </div>
      
      <div class="col-md-3">
        <a href="tasks.html" class="card dashboard-card card-completed text-center shadow-sm p-4 text-decoration-none">
          <div class="icon-box bg-success bg-opacity-10 text-success">
            <i class="bi bi-check-circle-fill"></i>
          </div>
          <h6 class="text-muted fw-semibold">Tâches terminées</h6>
          <h2 id="tachesTerminees" class="fw-bold mb-0 text-success">0</h2>
        </a>
      </div>
      
      <div class="col-md-3">
        <a href="tasks.html" class="card dashboard-card card-late text-center shadow-sm p-4 text-decoration-none">
          <div class="icon-box bg-danger bg-opacity-10 text-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
          </div>
          <h6 class="text-muted fw-semibold">En retard</h6>
          <h2 id="tachesRetard" class="fw-bold mb-0 text-danger">0</h2>
        </a>
      </div>
    </div>
  </div>

  <div class="modal fade" id="notifModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header" style="background-color: #3c3489;">
            <h5 class="modal-title text-white">
              <i class="bi bi-bell-fill me-2"></i>Notifications
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="notifListe">
            <p class="text-center text-muted">Chargement...</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Fermer</button>
          </div>
        </div> 
    </div>
  </div> 

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/notifications.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('currentDate').textContent = new Date().toLocaleDateString('fr-FR', options);
    });
  </script>
</body>
</html>
