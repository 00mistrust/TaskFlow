<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow — Tableau de bord</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color: #3c3489;">
  <a class="navbar-brand fw-bold fs-4" href="dashboard.html">
    <i class="bi bi-kanban-fill me-2"></i>TaskFlow
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link active" href="dashboard.html">
          <i class="bi bi-speedometer2 me-1"></i>Tableau de bord
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="projects.html">
          <i class="bi bi-folder me-1"></i>Projets
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="tasks.html">
          <i class="bi bi-check2-square me-1"></i>Tâches
        </a>
      </li>
    </ul>
    <ul class="navbar-nav ms-auto align-items-center">
      <li class="nav-item me-3">
        <a class="nav-link active" href="activities.html" title="Historique des activités">
          <i class="bi bi-clock-history fs-5"></i>
        </a>
      </li>
      <li class="nav-item me-3">
        <a class="nav-link position-relative" href="#">
          <i class="bi bi-bell-fill fs-5"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notifBadge">0</span>
        </a>
      </li>
      <li class="nav-item me-3">
        <span class="navbar-text text-white">
          <i class="bi bi-person-circle me-1"></i>
          <span id="userName">Utilisateur</span>
        </span>
      </li>
      <li class="nav-item">
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">
          <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
        </button>
      </li>
    </ul>
  </div>
</nav>

  <div class="container mt-5">
    <h2 class="mb-4" style="color: #3c3489;">Mon Tableau de bord</h2>
    <div class="row g-4">
      <div class="col-md-3">
        <div class="card text-center shadow-sm p-3">
          <h6 class="text-muted">Projets actifs</h6>
          <h2 id="projetsActifs" class="fw-bold" style="color: #4f46e5;">0</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center shadow-sm p-3">
          <h6 class="text-muted">Tâches assignées</h6>
          <h2 id="tachesAssignees" class="fw-bold" style="color: #4f46e5;">0</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center shadow-sm p-3">
          <h6 class="text-muted">Tâches terminées</h6>
          <h2 id="tachesTerminees" class="fw-bold" style="color: #4f46e5;">0</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center shadow-sm p-3">
          <h6 class="text-muted">Tâches en retard</h6>
          <h2 id="tachesRetard" class="fw-bold text-danger">0</h2>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
