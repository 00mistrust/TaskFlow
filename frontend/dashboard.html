<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow — Tableau de bord</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark px-4" style="background-color: #3c3489;">
    <span class="navbar-brand fw-bold">TaskFlow</span>
    <button class="btn btn-outline-light btn-sm" id="logoutBtn">Déconnexion</button>
  </nav>

  <div class="container mt-5">
    <h2 class="mb-4" style="color: #3c3489;">Mon Tableau de bord</h2>
    <div class="row g-4">
      <div class="col-md-3">
        <div class="card text-center shadow-sm p-3">
          <h6 class="text-muted">Projets actifs</h6>
          <h2 id="projetsActifs" class="fw-bold" style="color: #4f46e5;">0</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center shadow-sm p-3">
          <h6 class="text-muted">Tâches assignées</h6>
          <h2 id="tachesAssignees" class="fw-bold" style="color: #4f46e5;">0</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center shadow-sm p-3">
          <h6 class="text-muted">Tâches terminées</h6>
          <h2 id="tachesTerminees" class="fw-bold" style="color: #4f46e5;">0</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center shadow-sm p-3">
          <h6 class="text-muted">Tâches en retard</h6>
          <h2 id="tachesRetard" class="fw-bold text-danger">0</h2>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
