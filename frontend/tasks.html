<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Tâches</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .badge-priority-haute   { background-color: #ef4444; }
    .badge-priority-moyenne { background-color: #f59e0b; }
    .badge-priority-basse   { background-color: #10b981; }
    .badge-status-afaire  { background-color: #6b7280; }
    .badge-status-encours { background-color: #3b82f6; }
    .badge-status-termine { background-color: #10b981; }
    .task-card {
      border-radius: 12px;
      border: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .task-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1) !important;
    }
    .filter-section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .pagination-btn {
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 0.875rem;
    }
    .pagination-btn:disabled { background-color: #c7c7c7; }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
    }
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color: #3c3489;">
    <a class="navbar-brand fw-bold fs-4" href="dashboard.html">
      <i class="bi bi-kanban-fill me-2"></i>TaskFlow
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="dashboard.html">
            <i class="bi bi-speedometer2 me-1"></i>Tableau de bord
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="projects.html">
            <i class="bi bi-folder me-1"></i>Projets
          </a>
        </li>
          <li class="nav-item">
            <a class="nav-link" href="members.html">
              <i class="bi bi-people me-1"></i>Membres
            </a>
        <li class="nav-item">
          <a class="nav-link active" href="tasks.html">
            <i class="bi bi-check2-square me-1"></i>Tâches
          </a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item me-3">
          <a class="nav-link position-relative" href="#">
            <i class="bi bi-bell-fill fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notifBadge">0</span>
          </a>
        </li>
        <li class="nav-item me-3">
          <span class="navbar-text text-white">
            <i class="bi bi-person-circle me-1"></i>
            <span id="userName">Utilisateur</span>
          </span>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-light btn-sm" id="logoutBtn">
            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 style="color: #3c3489;"><i class="bi bi-check2-square me-2"></i>Gestion des tâches</h2>
  <div class="d-flex gap-2">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
      <i class="bi bi-plus-lg me-1"></i>Nouvelle tâche
    </button>
  </div>
</div>

    <div class="filter-section mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label text-muted small fw-semibold">RECHERCHER</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-search text-muted"></i>
            </span>
            <input type="text" class="form-control border-start-0" id="searchInput" placeholder="Mot-clé dans le titre ou description...">
          </div>
        </div>
        <div class="col-md-2">
          <label class="form-label text-muted small fw-semibold">STATUT</label>
          <select class="form-select" id="filterStatus">
            <option value="">Tous</option>
            <option value="à faire">À faire</option>
            <option value="en cours">En cours</option>
            <option value="terminé">Terminé</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label text-muted small fw-semibold">PRIORITÉ</label>
          <select class="form-select" id="filterPriority">
            <option value="">Toutes</option>
            <option value="haute">Haute</option>
            <option value="moyenne">Moyenne</option>
            <option value="basse">Basse</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label text-muted small fw-semibold">MEMBRE</label>
          <select class="form-select" id="filterMember">
            <option value="">Tous</option>
          </select>
        </div>
        <div class="col-md-1">
          <button class="btn btn-primary w-100" onclick="applyFilters()">
            <i class="bi bi-funnel me-1"></i>Filtrer
          </button>
        </div>
        <div class="col-md-2">
          <button class="btn btn-outline-secondary w-100" onclick="resetFilters()">
            <i class="bi bi-arrow-counterclockwise me-1"></i>Réinitialiser
          </button>
        </div>
      </div>
    </div>

    <div id="taskList" class="row g-3">
      <div class="empty-state">
        <i class="bi bi-hourglass-split fs-1 mb-3 d-block"></i>
        <p>Chargement des tâches...</p>
      </div>
    </div>

    <div id="pagination" class="d-flex justify-content-center align-items-center gap-3 mt-4"></div>

  </div>

  <!-- Add Task Modal -->
  <div class="modal fade" id="addTaskModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" style="border-radius: 16px; border: none;">
        <div class="modal-header" style="background-color: #3c3489; border-radius: 16px 16px 0 0;">
          <h5 class="modal-title text-white">
            <i class="bi bi-plus-circle me-2"></i>Nouvelle tâche
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div class="mb-3">
            <label class="form-label fw-semibold">Titre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="taskTitle" placeholder="Ex: Créer la page d'accueil">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea class="form-control" id="taskDescription" rows="2" placeholder="Description optionnelle..."></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Priorité <span class="text-danger">*</span></label>
            <select class="form-select" id="taskPriority">
              <option value="">-- Choisir --</option>
              <option value="haute">🔴 Haute</option>
              <option value="moyenne">🟡 Moyenne</option>
              <option value="basse">🟢 Basse</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Statut <span class="text-danger">*</span></label>
            <select class="form-select" id="taskStatus">
              <option value="">-- Choisir --</option>
              <option value="à faire">À faire</option>
              <option value="en cours">En cours</option>
              <option value="terminé">Terminé</option>
            </select>
          </div>
          <div id="formError" class="alert alert-danger d-none"></div>
        </div>
        <div class="modal-footer">
        <a href="brouillons.html" class="btn btn-outline-warning">
          <i class="bi bi-file-earmark-text me-1"></i>Brouillon
        </a>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-primary" onclick="addTask()">
            <i class="bi bi-check2 me-1"></i>Ajouter
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal fade" id="editTaskModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" style="border-radius: 16px; border: none;">
        <div class="modal-header" style="background-color: #4f46e5; border-radius: 16px 16px 0 0;">
          <h5 class="modal-title text-white">
            <i class="bi bi-pencil-square me-2"></i>Modifier la tâche
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <input type="hidden" id="editTaskId">
          <div class="mb-3">
            <label class="form-label fw-semibold">Titre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="editTaskTitle">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea class="form-control" id="editTaskDescription" rows="3" placeholder="Description optionnelle..."></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Priorité <span class="text-danger">*</span></label>
            <select class="form-select" id="editTaskPriority">
              <option value="haute">🔴 Haute</option>
              <option value="moyenne">🟡 Moyenne</option>
              <option value="basse">🟢 Basse</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Statut <span class="text-danger">*</span></label>
            <select class="form-select" id="editTaskStatus">
              <option value="à faire">À faire</option>
              <option value="en cours">En cours</option>
              <option value="terminé">Terminé</option>
            </select>
          </div>
          <div id="editFormError" class="alert alert-danger d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-primary" onclick="saveEdit()">
            <i class="bi bi-check2 me-1"></i>Sauvegarder
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const BASE_URL = 'http://localhost:5000/api/tasks';
    const token = localStorage.getItem('token');
    let currentPage = 1;

    if (!token) window.location.href = 'login.html';

    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.name) document.getElementById('userName').textContent = user.name;

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });

    const params = new URLSearchParams(window.location.search);
    const PROJECT_ID = params.get('id') || null;

    const DRAFT_KEY = 'draft_' + (PROJECT_ID || 'default');

    async function loadTasks(page = 1) {
      try {
        const search = document.getElementById('searchInput').value;
        const status = document.getElementById('filterStatus').value;
        const priority = document.getElementById('filterPriority').value;
        const member = document.getElementById('filterMember').value;

        const query = new URLSearchParams();
        query.append('page', page);
        query.append('limit', 6);
        if (search) query.append('search', search);
        if (status) query.append('status', status);
        if (priority) query.append('priority', priority);
        if (member) query.append('assignedTo', member);

        const url = PROJECT_ID
          ? `${BASE_URL}/project/${PROJECT_ID}?${query}`
          : `${BASE_URL}?${query}`;

        const res = await axios.get(url, {
          headers: { Authorization: `Bearer ${token}` }
        });

        renderTasks(res.data.data);
        renderPagination(res.data.page, res.data.totalPages);
        currentPage = res.data.page;
      } catch (err) {
        if (err.response?.status === 401) window.location.href = 'login.html';
        document.getElementById('taskList').innerHTML = `
          <div class="empty-state col-12">
            <i class="bi bi-exclamation-circle fs-1 mb-3 d-block text-danger"></i>
            <p>Erreur lors du chargement des tâches.</p>
          </div>`;
      }
    }

    function renderTasks(tasks) {
      const list = document.getElementById('taskList');
      if (!tasks || tasks.length === 0) {
        list.innerHTML = `
          <div class="empty-state col-12">
            <i class="bi bi-inbox fs-1 mb-3 d-block"></i>
            <p>Aucune tâche trouvée.</p>
          </div>`;
        return;
      }
      list.innerHTML = tasks.map(task => {
        const priorityClass = { 'haute': 'badge-priority-haute', 'moyenne': 'badge-priority-moyenne', 'basse': 'badge-priority-basse' }[task.priority] || 'bg-secondary';
        const statusClass = { 'à faire': 'badge-status-afaire', 'en cours': 'badge-status-encours', 'terminé': 'badge-status-termine' }[task.status] || 'bg-secondary';
        const descriptionText = task.description ? `<p class="card-text small text-muted mb-3">${task.description}</p>` : '';
        const descEscaped = (task.description || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        return `
          <div class="col-md-6 col-lg-4">
            <div class="card task-card shadow-sm h-100">
              <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h6 class="card-title fw-bold mb-0" style="color: #1f2937;">${task.title}</h6>
                  <span class="badge ${priorityClass} text-white ms-2">${task.priority}</span>
                </div>
                ${descriptionText}
                <span class="badge ${statusClass} text-white mb-3">${task.status}</span>
                <div class="d-flex gap-2 mt-3">
                  <select class="form-select form-select-sm" onchange="updateStatus('${task._id}', this.value)">
                    <option value="à faire" ${task.status === 'à faire' ? 'selected' : ''}>À faire</option>
                    <option value="en cours" ${task.status === 'en cours' ? 'selected' : ''}>En cours</option>
                    <option value="terminé" ${task.status === 'terminé' ? 'selected' : ''}>Terminé</option>
                  </select>
                  <button class="btn btn-outline-primary btn-sm" onclick="openEdit('${task._id}', '${task.title.replace(/'/g, "\\'")}', '${descEscaped}', '${task.priority}', '${task.status}')">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-outline-danger btn-sm" onclick="deleteTask('${task._id}')">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function renderPagination(page, totalPages) {
      const div = document.getElementById('pagination');
      if (totalPages <= 1) { div.innerHTML = ''; return; }
      div.innerHTML = `
        <button class="pagination-btn" onclick="loadTasks(${page - 1})" ${page <= 1 ? 'disabled' : ''}>
          <i class="bi bi-chevron-left"></i> Précédent
        </button>
        <span class="text-muted small">Page ${page} / ${totalPages}</span>
        <button class="pagination-btn" onclick="loadTasks(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>
          Suivant <i class="bi bi-chevron-right"></i>
        </button>`;
    }

    async function addTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const priority = document.getElementById('taskPriority').value;
      const status = document.getElementById('taskStatus').value;
      const description = document.getElementById('taskDescription').value;
      const errorDiv = document.getElementById('formError');

      if (!title || !priority || !status) {
        errorDiv.textContent = 'Veuillez remplir tous les champs.';
        errorDiv.classList.remove('d-none');
        return;
      }
      errorDiv.classList.add('d-none');

      try {
        await axios.post(BASE_URL, {
          title, description, priority, status,
          project: PROJECT_ID || '507f1f77bcf86cd799439011'
        }, { headers: { Authorization: `Bearer ${token}` } });

        bootstrap.Modal.getInstance(document.getElementById('addTaskModal')).hide();
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDescription').value = '';
        document.getElementById('taskPriority').value = '';
        document.getElementById('taskStatus').value = '';
        localStorage.removeItem(DRAFT_KEY);
        loadTasks(currentPage);
      } catch (err) {
        errorDiv.textContent = err.response?.data?.error || 'Erreur lors de l\'ajout.';
        errorDiv.classList.remove('d-none');
      }
    }

    function openEdit(id, title, description, priority, status) {
      document.getElementById('editTaskId').value = id;
      document.getElementById('editTaskTitle').value = title;
      document.getElementById('editTaskDescription').value = description;
      document.getElementById('editTaskPriority').value = priority;
      document.getElementById('editTaskStatus').value = status;
      document.getElementById('editFormError').classList.add('d-none');
      new bootstrap.Modal(document.getElementById('editTaskModal')).show();
    }

    async function saveEdit() {
      const id = document.getElementById('editTaskId').value;
      const title = document.getElementById('editTaskTitle').value.trim();
      const description = document.getElementById('editTaskDescription').value;
      const priority = document.getElementById('editTaskPriority').value;
      const status = document.getElementById('editTaskStatus').value;
      const errorDiv = document.getElementById('editFormError');

      if (!title) {
        errorDiv.textContent = 'Le titre est obligatoire.';
        errorDiv.classList.remove('d-none');
        return;
      }
      errorDiv.classList.add('d-none');

      try {
        await axios.put(`${BASE_URL}/${id}`, {
          title, description, priority, status
        }, { headers: { Authorization: `Bearer ${token}` } });

        bootstrap.Modal.getInstance(document.getElementById('editTaskModal')).hide();
        loadTasks(currentPage);
      } catch (err) {
        errorDiv.textContent = err.response?.data?.error || 'Erreur lors de la modification.';
        errorDiv.classList.remove('d-none');
      }
    }

    async function updateStatus(id, status) {
      try {
        await axios.patch(`${BASE_URL}/${id}/status`, { status }, {
          headers: { Authorization: `Bearer ${token}` }
        });
        loadTasks(currentPage);
      } catch (err) { alert('Erreur lors de la mise à jour.'); }
    }

    async function deleteTask(id) {
      if (!confirm('Supprimer cette tâche ?')) return;
      try {
        await axios.delete(`${BASE_URL}/${id}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        loadTasks(currentPage);
      } catch (err) { alert('Erreur lors de la suppression.'); }
    }

    function applyFilters() { loadTasks(1); }
    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterPriority').value = '';
      document.getElementById('filterMember').value = '';
      loadTasks(1);
    }

    async function loadMembers() {
      if (!PROJECT_ID) return;
      try {
        const res = await axios.get(`http://localhost:5000/api/projects/${PROJECT_ID}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const select = document.getElementById('filterMember');
        const members = res.data.members || [];
        members.forEach(member => {
          const option = document.createElement('option');
          option.value = member._id;
          option.textContent = member.name || member.email;
          select.appendChild(option);
        });
      } catch (err) {
        console.log('Membres non disponibles pour linstant');
      }
    }

    ['taskTitle', 'taskPriority', 'taskStatus'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        const draft = {
          title: document.getElementById('taskTitle').value,
          priority: document.getElementById('taskPriority').value,
          status: document.getElementById('taskStatus').value
        };
        localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
      });
    });

    document.getElementById('addTaskModal').addEventListener('show.bs.modal', () => {
      const saved = localStorage.getItem(DRAFT_KEY);
      if (saved) {
        const draft = JSON.parse(saved);
        if (saved) {
          document.getElementById('taskTitle').value = draft.title || '';
          document.getElementById('taskPriority').value = draft.priority || '';
          document.getElementById('taskStatus').value = draft.status || '';
           document.getElementById('taskDescription').value = draft.description || '';
        }
      }
    });

    async function pollNotifications() {
      try {
        const res = await axios.get('http://localhost:5000/api/notifications', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const unread = res.data.filter(n => !n.read).length;
        document.getElementById('notifBadge').textContent = unread;
        const read = res.data.filter(n => n.read);
        localStorage.setItem('notifications_archived', JSON.stringify(read));
      } catch (err) {
        console.log('Notifications non disponibles');
      }
    }

    loadMembers();
    pollNotifications();
    setInterval(pollNotifications, 30000);
    // Ouvrir le modal automatiquement si on vient du brouillon
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('openDraft') === 'true') {
  new bootstrap.Modal(document.getElementById('addTaskModal')).show();
}
    loadTasks();
  </script>
</body>
</html>
