<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionnaire de tâches</title>
</head>
<body>
  <h2>Liste des tâches</h2>

  <form id="taskForm">
    <input type="text" id="taskTitle" placeholder="Titre de la tâche" required>
    
    <select id="taskPriority" required>
      <option value="">-- Priorité --</option>
      <option value="basse">Basse</option>
      <option value="moyenne">Moyenne</option>
      <option value="haute">Haute</option>
    </select>

    <select id="taskStatus" required>
      <option value="">-- Statut --</option>
      <option value="à faire">À faire</option>
      <option value="en cours">En cours</option>
      <option value="terminé">Terminé</option>
    </select>

    <button type="submit">Ajouter</button>
  </form>

  <ul id="taskList"></ul>

  <script>
    const BASE_URL = 'http://localhost:3000/api/tasks';
    const PROJECT_ID = "507f1f77bcf86cd799439011"; // remplacer plus tard

    async function loadTasks() {
      try {
        const response = await fetch(BASE_URL);
        const tasks = await response.json();
        renderTasks(tasks);
      } catch (err) {
        console.error('Erreur chargement:', err);
      }
    }

    function renderTasks(tasks) {
      const list = document.getElementById('taskList');
      list.innerHTML = "";
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.textContent = `${task.title} | Priorité: ${task.priority} | Statut: ${task.status}`;
        list.appendChild(li);
      });
    }

    document.getElementById('taskForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const title = document.getElementById('taskTitle').value;
      const priority = document.getElementById('taskPriority').value;
      const status = document.getElementById('taskStatus').value;

      try {
        const response = await fetch(BASE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, priority, status, project: PROJECT_ID })
        });

        if (!response.ok) {
          const err = await response.json();
          alert('Erreur: ' + err.error);
          return;
        }

        await loadTasks(); // recharge toute la liste proprement
        this.reset();
      } catch (err) {
        console.error('Erreur ajout:', err);
      }
    });

    loadTasks();
  </script>
</body>
</html>
