<!DOCTYPE html>
<html lang="fr">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F7 - Brouillons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f172a;
        }
    </style>
</head>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4" style="width: 480px; background: #1e293b; border-radius: 16px;">

        <h2 class="text-info mb-3">📝 Nouvelle tâche</h2>

        <div id="draft-banner" class="alert alert-primary d-none d-flex justify-content-between align-items-center mb-3">
            <span>💾 Brouillon détecté — Restaurer ?</span>
            <div>
                <button id="btn-restore" class="btn btn-sm btn-light">Restaurer</button>
                <button id="btn-discard" class="btn btn-sm btn-outline-light ms-2">Ignorer</button>
            </div>
        </div>

        <form id="task-form">
            <div class="mb-3">
                <label class="form-label text-secondary">Titre de la tâche</label>
                <input type="text" id="titre" class="form-control" placeholder="Ex: Créer la page login" />
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary">Description</label>
                <textarea id="description" class="form-control" rows="3" placeholder="Décrivez la tâche..."></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary">Priorité</label>
                <select id="priorite" class="form-select">
                    <option value="">-- Choisir --</option>
                    <option value="basse">Basse</option>
                    <option value="moyenne">Moyenne</option>
                    <option value="haute">Haute</option>
                </select>
            </div>
            <div id="saved-indicator" class="text-success small mb-2"></div>
            <button type="submit" id="btn-submit" class="btn btn-primary w-100">✅ Créer la tâche</button>
        </form>
    </div>

    <script>
        const titreInput   = document.getElementById("titre");
        const descInput    = document.getElementById("description");
        const prioriteSelect = document.getElementById("priorite");
        const savedIndicator = document.getElementById("saved-indicator");
        const draftBanner  = document.getElementById("draft-banner");
        const btnRestore   = document.getElementById("btn-restore");
        const btnDiscard   = document.getElementById("btn-discard");
        const taskForm     = document.getElementById("task-form");

        const DRAFT_KEY = "draft_42";

        // Sauvegarder le brouillon à chaque saisie
        function saveDraft() {
            const draft = {
                titre: titreInput.value,
                description: descInput.value,
                priorite: prioriteSelect.value
            };
            localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
            savedIndicator.textContent = "💾 Brouillon sauvegardé automatiquement";
            setTimeout(() => { savedIndicator.textContent = ""; }, 2000);
        }

        titreInput.addEventListener("input", saveDraft);
        descInput.addEventListener("input", saveDraft);
        prioriteSelect.addEventListener("change", saveDraft);

        // Au chargement : détecter un brouillon
        window.addEventListener("DOMContentLoaded", () => {
            const savedDraft = localStorage.getItem(DRAFT_KEY);
            if (savedDraft) {
                draftBanner.style.display = "flex";
            }
        });

        // Bouton Restaurer
        btnRestore.addEventListener("click", () => {
            const savedDraft = localStorage.getItem(DRAFT_KEY);
            if (savedDraft) {
                const draft = JSON.parse(savedDraft);
                titreInput.value      = draft.titre       || "";
                descInput.value       = draft.description || "";
                prioriteSelect.value  = draft.priorite    || "";
            }
            draftBanner.style.display = "none";
        });

        // Bouton Ignorer
        btnDiscard.addEventListener("click", () => {
            localStorage.removeItem(DRAFT_KEY);
            draftBanner.style.display = "none";
        });

        // Soumission du formulaire
        taskForm.addEventListener("submit", (e) => {
            e.preventDefault();
            console.log("Tâche créée !");
            localStorage.removeItem(DRAFT_KEY);
            taskForm.reset();
            savedIndicator.textContent = "";
        });
    </script>
</body>
</html>
