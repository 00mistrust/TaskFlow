<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Brouillons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <!-- MÊME NAVBAR QUE TASKS.HTML -->
  <nav class="navbar navbar-expand-lg navbar-dark px-4" style="background-color: #3c3489;">
    <a class="navbar-brand fw-bold fs-4" href="dashboard.html">
      <i class="bi bi-kanban-fill me-2"></i>TaskFlow
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="dashboard.html">
            <i class="bi bi-speedometer2 me-1"></i>Tableau de bord
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="projects.html">
            <i class="bi bi-folder me-1"></i>Projets
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="members.html">
            <i class="bi bi-people me-1"></i>Membres
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="tasks.html">
            <i class="bi bi-check2-square me-1"></i>Tâches
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="brouillons.html">
            <i class="bi bi-file-earmark-text me-1"></i>Brouillons
          </a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item me-3">
          <a class="nav-link position-relative" href="#">
            <i class="bi bi-bell-fill fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notifBadge">0</span>
          </a>
        </li>
        <li class="nav-item me-3">
          <span class="navbar-text text-white">
            <i class="bi bi-person-circle me-1"></i>
            <span id="userName">Utilisateur</span>
          </span>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-light btn-sm" id="logoutBtn">
            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 style="color: #3c3489;">
          <i class="bi bi-file-earmark-text me-2"></i>Brouillon de tâche
        </h2>
        <p class="text-muted small mb-0">Les données sont sauvegardées automatiquement dans votre navigateur.</p>
      </div>
      <span class="badge bg-warning text-dark fs-6 px-3 py-2">
        <i class="bi bi-pencil me-1"></i>BROUILLON
      </span>
    </div>

    <!-- BANNIÈRE BROUILLON DÉTECTÉ -->
    <div id="draft-banner" class="alert alert-warning d-none d-flex justify-content-between align-items-center mb-4">
      <span><i class="bi bi-exclamation-circle me-2"></i>Brouillon existant détecté — Voulez-vous le restaurer ?</span>
      <div>
        <button id="btn-restore" class="btn btn-sm btn-dark">
          <i class="bi bi-arrow-counterclockwise me-1"></i>Restaurer le brouillon
        </button>
        <button id="btn-discard" class="btn btn-sm btn-outline-dark ms-2">
          Ignorer
        </button>
      </div>
    </div>

    <!-- FORMULAIRE BROUILLON -->
    <div class="card shadow-sm" style="border-radius: 12px; border: none;">
      <div class="card-body p-4">

        <div class="d-flex align-items-center gap-2 mb-4">
          <span class="badge bg-warning text-dark">BROUILLON EN COURS</span>
          <span id="saved-indicator" class="text-success small"></span>
        </div>

        <form id="task-form">
          <div class="mb-3">
            <label class="form-label fw-semibold">Titre du brouillon <span class="text-danger">*</span></label>
            <input type="text" id="titre" class="form-control" placeholder="Ex: Créer la page login" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea id="description" class="form-control" rows="3" placeholder="Décrivez la tâche..."></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Priorité</label>
            <select id="priorite" class="form-select">
              <option value="">-- Choisir --</option>
              <option value="basse">🟢 Basse</option>
              <option value="moyenne">🟡 Moyenne</option>
              <option value="haute">🔴 Haute</option>
            </select>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check2 me-1"></i>Soumettre la tâche
            </button>
            <button type="button" id="btn-clear" class="btn btn-outline-danger">
              <i class="bi bi-trash me-1"></i>Effacer le brouillon
            </button>
            <a href="tasks.html" class="btn btn-outline-secondary ms-auto">
              <i class="bi bi-arrow-left me-1"></i>Retour aux tâches
            </a>
          </div>
        </form>

      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.name) document.getElementById('userName').textContent = user.name;

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });

    const params = new URLSearchParams(window.location.search);
    const PROJECT_ID = params.get('id') || null;
    const DRAFT_KEY = 'draft_' + (PROJECT_ID || 'default');

    const titreInput     = document.getElementById("titre");
    const descInput      = document.getElementById("description");
    const prioriteSelect = document.getElementById("priorite");
    const savedIndicator = document.getElementById("saved-indicator");
    const draftBanner    = document.getElementById("draft-banner");
    const btnRestore     = document.getElementById("btn-restore");
    const btnDiscard     = document.getElementById("btn-discard");
    const btnClear       = document.getElementById("btn-clear");
    const taskForm       = document.getElementById("task-form");

    // Sauvegarder à chaque saisie
    function saveDraft() {
      const draft = {
        titre:       titreInput.value,
        description: descInput.value,
        priorite:    prioriteSelect.value
      };
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
      savedIndicator.textContent = "💾 Brouillon sauvegardé automatiquement";
      setTimeout(() => { savedIndicator.textContent = ""; }, 2000);
    }

    titreInput.addEventListener("input", saveDraft);
    descInput.addEventListener("input", saveDraft);
    prioriteSelect.addEventListener("change", saveDraft);

    // Au chargement : détecter un brouillon
    window.addEventListener("DOMContentLoaded", () => {
      const savedDraft = localStorage.getItem(DRAFT_KEY);
      if (savedDraft) {
        draftBanner.classList.remove("d-none");
      }
    });

    // Restaurer le brouillon
    btnRestore.addEventListener("click", () => {
      const savedDraft = localStorage.getItem(DRAFT_KEY);
      if (savedDraft) {
        const draft = JSON.parse(savedDraft);
        titreInput.value     = draft.titre       || "";
        descInput.value      = draft.description || "";
        prioriteSelect.value = draft.priorite    || "";
      }
      draftBanner.classList.add("d-none");
    });

    // Ignorer le brouillon
    btnDiscard.addEventListener("click", () => {
      localStorage.removeItem(DRAFT_KEY);
      draftBanner.classList.add("d-none");
    });

    // Effacer le brouillon
    btnClear.addEventListener("click", () => {
      if (confirm("Effacer le brouillon ? Cette action est irréversible.")) {
        localStorage.removeItem(DRAFT_KEY);
        taskForm.reset();
        savedIndicator.textContent = "🗑️ Brouillon effacé";
        setTimeout(() => { savedIndicator.textContent = ""; }, 2000);
      }
    });

    // Soumission
    taskForm.addEventListener("submit", (e) => {
      e.preventDefault();
      localStorage.removeItem(DRAFT_KEY);
      taskForm.reset();
      savedIndicator.textContent = "✅ Tâche créée, brouillon supprimé";
      setTimeout(() => { savedIndicator.textContent = ""; }, 3000);
      window.location.href = 'tasks.html';
    });

    // Polling notifications
    async function pollNotifications() {
      try {
        const res = await axios.get('http://localhost:5000/api/notifications', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const unread = res.data.filter(n => !n.read).length;
        document.getElementById('notifBadge').textContent = unread;
        const read = res.data.filter(n => n.read);
        localStorage.setItem('notifications_archived', JSON.stringify(read));
      } catch (err) {
        console.log('Notifications non disponibles');
      }
    }

    pollNotifications();
    setInterval(pollNotifications, 30000);
  </script>
</body>
</html>
